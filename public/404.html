<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <script>
      // Single-Page App fallback for GitHub Pages.
      // Redirects 404s back to index.html so React Router (if ever added) works.
      // Source: https://github.com/rafgraph/spa-github-pages
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + 1).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(1).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
</html>
