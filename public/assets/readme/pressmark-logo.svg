<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 130" width="460" height="130">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Cosmic Window -->
  <rect x="4" y="4" width="452" height="122" rx="18" fill="url(#bgGrad)" stroke="url(#accentGrad)" stroke-width="2"/>

  <!-- Subtle Starfield -->
  <circle cx="42" cy="24" r="1.2" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="418" cy="28" r="1.5" fill="#00E5FF" opacity="0.8"/>
  <circle cx="388" cy="98" r="1" fill="#F59E0B" opacity="0.7"/>
  <circle cx="98" cy="104" r="1.2" fill="#8B5CF6" opacity="0.6"/>

  <!-- Pressmark Cosmic Stamp Emblem -->
  <g transform="translate(68, 65)" filter="url(#glow)">
    <circle cx="0" cy="0" r="30" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" stroke-dasharray="16 6">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="20s" repeatCount="indefinite"/>
    </circle>
    <rect x="-15" y="-15" width="30" height="30" rx="7" fill="#070B14" stroke="#00E5FF" stroke-width="2"/>
    <path d="M-7 -6 H2 A5 5 0 0 1 2 4 H-7 Z M-7 4 V9" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="22" cy="-22" r="3" fill="#F59E0B"/>
  </g>

  <!-- Title & Subtitle -->
  <text x="118" y="64" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800" letter-spacing="-0.5" fill="#FFFFFF">
    Pressmark
  </text>
  <text x="119" y="88" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" letter-spacing="1.2" fill="#94A3B8">
    WATERMARK &amp; MEDIA STUDIO · BY THEASTROBRUH
  </text>
</svg>
